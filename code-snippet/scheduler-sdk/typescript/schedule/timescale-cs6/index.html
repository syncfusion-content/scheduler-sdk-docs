<!DOCTYPE html>
<html lang="en">

<head>
    <title>Schedule Current Time Indicator Customization</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Typescript Schedule Control" />
    <meta name="author" content="Syncfusion" />
    <link href="index.css" rel="stylesheet" />
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/tailwind3.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/systemjs/0.19.38/system.js" type="text/javascript"></script>
    <script src="systemjs.config.js" type="text/javascript"></script>
</head>

<body>
    <div id='loader'>LOADING....</div>
    <div id='container'>
        <div id="Schedule"></div>
        <div style="margin-top: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="master-toggle" checked="checked" />
                showTimeIndicator
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="show-time-toggle" checked="checked" />
                showTime
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="show-previous-dates-toggle" checked="checked" />
                showPreviousDates
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="on-top-toggle" checked="checked" />
                onTop
            </label>
        </div>
    </div>
</body>

</html>

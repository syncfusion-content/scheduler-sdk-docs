<!DOCTYPE html>
<html lang="en">

<head>
    <title>Schedule Current Time Indicator Customization</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript Schedule Control">
    <meta name="author" content="Syncfusion">
    <link href="index.css" rel="stylesheet">
    <link href="https://cdn.syncfusion.com/ej2/34.1.29/bootstrap5.3.css" rel="stylesheet" />
    <script src="https://cdn.syncfusion.com/ej2/34.1.29/dist/ej2.min.js" type="text/javascript"></script>
    <script src="es5-datasource.js" type="text/javascript"></script>
</head>

<body>
    <div id="container">
        <div id="Schedule"></div>
        <div style="margin-top: 12px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center;">
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="master-toggle" checked />
                showTimeIndicator
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="show-time-toggle" checked />
                showTime
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="show-previous-dates-toggle" checked />
                showPreviousDates
            </label>
            <label style="display: inline-flex; align-items: center; gap: 6px; font-weight: 600;">
                <input type="checkbox" id="on-top-toggle" checked />
                onTop
            </label>
        </div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
